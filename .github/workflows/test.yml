name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      moleditpy_ref:
        description: 'MoleditPy branch, tag, or full commit SHA (blank uses repository default)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  QT_API: pyside6
  PYTEST_QT_API: pyside6
  QT_QPA_PLATFORM: offscreen
  MOLEDITPY_REF: ${{ inputs.moleditpy_ref || vars.MOLEDITPY_REF || 'v5.0.0a2' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
        include:
          - os: ubuntu-latest
            python: '3.9'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Checkout selected MoleditPy source
        uses: actions/checkout@v4
        with:
          repository: HiroYokoyama/python_molecular_editor
          ref: ${{ env.MOLEDITPY_REF }}
          path: host-app

      - name: Record resolved host commit
        run: git -C host-app log -1 --format="%H %s"

      - name: Install System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libdbus-1-3 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0 libxcb-shape0 libxcb-cursor0 libgl1-mesa-dri xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-plugin.txt rdkit pytest-qt pytest

      - name: Install web server dependencies
        if: matrix.python != '3.9'
        run: python -m pip install -r requirements.txt

      - name: Run tests
        env:
          CI_MAIN_APP_SRC: ${{ github.workspace }}/host-app/moleditpy/src
        shell: bash
        run: |
          if [ "${{ matrix.python }}" = "3.9" ]; then
            python -m pytest tests/test_molibrary_plugin.py tests/test_molibrary_logic.py tests/test_molibrary_host.py -v --tb=short
          else
            python -m pytest tests/ -v --tb=short
          fi
